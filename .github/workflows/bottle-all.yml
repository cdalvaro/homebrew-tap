name: Bottle all formulae (runner manual)
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Label del runner hosted de GitHub (macOS-26, xcode-27, xcode-27-xlarge...)"
        required: true
        type: string

jobs:
  bottle-all:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@f8d4222eb633e65c2a0157383cf80861fc7fae7f # 2026.09.07.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@f8d4222eb633e65c2a0157383cf80861fc7fae7f # 2026.09.07.1

      - name: List formulae
        id: formulae
        run: |
          names=$(ls Formula/*.rb | xargs -n1 basename -s .rb | tr '\n' ' ')
          echo "list=$names" >> "$GITHUB_OUTPUT"

      - run: brew test-bot --only-cleanup-before
      - run: brew test-bot --only-setup
      - run: brew test-bot --only-formulae ${{ steps.formulae.outputs.list }}

      - name: Upload bottles as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ inputs.runner }}
          path: "*.bottle.*"
